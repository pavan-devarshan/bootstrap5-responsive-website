<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySite | Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">MySite</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <button class="btn btn-outline-light ms-3" onclick="toggleTheme()">
        <i class="bi bi-moon-fill"></i>
      </button>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="hero text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Modern Bootstrap Website</h1>
    <p class="lead text-muted mt-3">
      Clean UI • Responsive • Internship Ready
    </p>
    <div class="mt-4">
      <a href="about.html" class="btn btn-primary btn-lg me-2">Explore</a>
      <button class="btn btn-outline-secondary btn-lg" data-bs-toggle="modal" data-bs-target="#infoModal">
        Learn More
      </button>
    </div>
  </div>
</header>

<!-- CAROUSEL -->
<section class="py-5 bg-body-tertiary">
  <div class="container">
    <h2 class="text-center fw-bold mb-4">Highlights</h2>

    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner rounded shadow">

        <div class="carousel-item active">
          <img src="https://picsum.photos/1200/400?1" class="d-block w-100">
        </div>

        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?2" class="d-block w-100">
        </div>

        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?3" class="d-block w-100">
        </div>

      </div>

      <button class="carousel-control-prev" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer text-center">
  © 2026 MySite | Built with Bootstrap 5
</footer>

<!-- MODAL -->
<div class="modal fade" id="infoModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">About This Project</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        This project demonstrates Bootstrap components, responsive layout,
        and modern UI/UX practices.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="style.js"></script>
<script>
  function toggleTheme() {
    const html = document.documentElement;
    html.setAttribute(
      "data-bs-theme",
      html.getAttribute("data-bs-theme") === "dark" ? "light" : "dark"
    );
  }
</script>
</body>
</html>
